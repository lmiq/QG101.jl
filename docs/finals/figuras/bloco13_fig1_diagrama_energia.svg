<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="598" height="278" fill="white"/>

  <!-- Panel 1: Exotermica -->
  <text x="170" y="18" text-anchor="middle" font-size="14" font-weight="bold">Reação exotérmica</text>

  <line x1="50" y1="245" x2="50" y2="30" stroke="black" stroke-width="1.6"/>
  <polygon points="50,30 45,40 55,40" fill="black"/>
  <text x="26" y="140" text-anchor="middle" font-size="12" transform="rotate(-90 26 140)">Energia</text>

  <line x1="80" y1="85" x2="190" y2="85" stroke="black" stroke-width="2.2"/>
  <text x="135" y="70" text-anchor="middle" font-size="12.5">Reagentes</text>

  <line x1="160" y1="205" x2="270" y2="205" stroke="black" stroke-width="2.2"/>
  <text x="215" y="225" text-anchor="middle" font-size="12.5">Produtos</text>

  <line x1="175" y1="92" x2="175" y2="198" stroke="black" stroke-width="1.6" stroke-dasharray="5,3"/>
  <polygon points="175,198 170,188 180,188" fill="black"/>
  <text x="190" y="150" font-size="12.5">&#916;H &lt; 0</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" font-style="italic">(energia liberada para a vizinhança)</text>

  <!-- Panel 2: Endotermica -->
  <text x="460" y="18" text-anchor="middle" font-size="14" font-weight="bold">Reação endotérmica</text>

  <line x1="350" y1="245" x2="350" y2="30" stroke="black" stroke-width="1.6"/>
  <polygon points="350,30 345,40 355,40" fill="black"/>
  <text x="326" y="140" text-anchor="middle" font-size="12" transform="rotate(-90 326 140)">Energia</text>

  <line x1="380" y1="205" x2="490" y2="205" stroke="black" stroke-width="2.2"/>
  <text x="435" y="225" text-anchor="middle" font-size="12.5">Reagentes</text>

  <line x1="460" y1="85" x2="570" y2="85" stroke="black" stroke-width="2.2"/>
  <text x="515" y="70" text-anchor="middle" font-size="12.5">Produtos</text>

  <line x1="475" y1="198" x2="475" y2="92" stroke="black" stroke-width="1.6" stroke-dasharray="5,3"/>
  <polygon points="475,92 470,102 480,102" fill="black"/>
  <text x="488" y="150" font-size="12.5">&#916;H &gt; 0</text>
  <text x="460" y="258" text-anchor="middle" font-size="11" font-style="italic">(energia absorvida da vizinhança)</text>
</svg>
