<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="518" height="378" fill="white"/>

  <!-- Nodes -->
  <text x="95" y="45" text-anchor="middle" font-size="14" font-weight="bold">C(s) + O&#8322;(g)</text>
  <text x="425" y="45" text-anchor="middle" font-size="14" font-weight="bold">CO(g) + &#189;O&#8322;(g)</text>
  <text x="260" y="345" text-anchor="middle" font-size="14" font-weight="bold">CO&#8322;(g)</text>

  <!-- Arrow A -> B (top) -->
  <line x1="160" y1="50" x2="350" y2="50" stroke="black" stroke-width="2"/>
  <polygon points="350,50 340,45 340,55" fill="black"/>
  <text x="255" y="35" text-anchor="middle" font-size="13">&#916;H&#8322; = ?</text>

  <!-- Arrow B -> C (right side, diagonal) -->
  <line x1="410" y1="65" x2="290" y2="320" stroke="black" stroke-width="2"/>
  <polygon points="290,320 297,308 304,316" fill="black"/>
  <text x="395" y="190" font-size="13">&#916;H&#8323; =</text>
  <text x="395" y="208" font-size="13">&#8722;283 kJ/mol</text>

  <!-- Arrow A -> C (left side, diagonal, direct path) -->
  <line x1="100" y1="65" x2="230" y2="320" stroke="black" stroke-width="2.4"/>
  <polygon points="230,320 218,313 226,304" fill="black"/>
  <text x="55" y="190" font-size="13">&#916;H&#8321; =</text>
  <text x="55" y="208" font-size="13">&#8722;394 kJ/mol</text>
  <text x="40" y="226" font-size="11" font-style="italic">(caminho direto)</text>

  <text x="260" y="372" text-anchor="middle" font-size="11.5" font-style="italic">
    H é função de estado: &#916;H&#8321; = &#916;H&#8322; + &#916;H&#8323;
  </text>
</svg>
